<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wistful Shop</title>
<style>
:root{color-scheme:dark;--bg:#000;--c:#151517;--c2:#1d1d20;--t:#fff;--m:#8d8d93;--r:22px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:15px/1.35 -apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;position:relative;overflow-y:auto;padding:12px 14px 150px}
.card{background:var(--c);border-radius:var(--r);padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.sp{justify-content:space-between}
.m{color:var(--m);font-size:12.5px}
.pill{background:var(--c2);border-radius:99px;padding:5px 12px;font-size:12px;color:var(--m)}
h2{margin:18px 4px 10px;font-size:13px;font-weight:500;color:var(--m)}
.hero{position:relative;overflow:hidden;min-height:170px;display:flex;flex-direction:column;justify-content:flex-end;background:#111 center/cover}
.hero.img::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.8))}
.hero>*{position:relative}
.big{font-size:40px;font-weight:700;letter-spacing:-1px}
.big small{font-size:22px;color:var(--m);font-weight:500}
.av{width:36px;height:36px;border-radius:50%;background:center/cover #2bd9b4;display:grid;place-items:center;font-weight:600}
.p{display:flex;flex-direction:column;gap:6px;min-height:150px;justify-content:space-between;cursor:pointer;transition:transform .12s}
.p:active{transform:scale(.97)}
.ic{font-size:34px}
.bar{height:3px;border-radius:3px;background:#333;overflow:hidden}.bar i{display:block;height:100%;background:#8a8a90}
.btn{width:100%;border:0;border-radius:99px;padding:15px;font:600 15px inherit;background:#f2f2f2;color:#000;cursor:pointer}
.btn:disabled{background:#2a2a2d;color:#777}
.btn.s{background:var(--c);color:#fff;border-radius:var(--r)}
.li{display:flex;align-items:center;gap:12px;cursor:pointer}
.li .ar{margin-left:auto;width:30px;height:30px;border-radius:50%;background:var(--c2);display:grid;place-items:center;color:var(--m)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(34px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;background:rgba(24,24,26,.92);backdrop-filter:blur(14px);border-radius:99px;z-index:5}
.nav button{width:62px;height:50px;border:0;border-radius:99px;background:none;color:var(--m);font-size:21px;cursor:pointer}
.nav button.on{background:#2b2b2e;color:#fff}
.foot{position:fixed;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--m);font-size:12px;pointer-events:none}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 8px;height:36px;font-weight:600}
.top button{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.chip{background:var(--c);border:0;color:#fff;border-radius:16px;padding:14px 0;font:inherit;cursor:pointer}
.in{width:100%;background:var(--c);border:0;border-radius:var(--r);padding:16px;color:#fff;font:inherit;outline:none}
.in:focus-visible,button:focus-visible{outline:2px solid #fff}
.ctr{text-align:center}.ctr .big{margin:8px 0 2px}
.note{background:var(--c);border-radius:14px;padding:12px 14px;margin-bottom:8px;border-left:3px solid #333;font-size:13.5px}
.bb{position:fixed;left:50%;transform:translateX(-50%);width:min(492px,calc(100% - 28px));bottom:calc(34px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:6}
.qty{display:flex;align-items:center;gap:12px;background:var(--c);border-radius:99px;padding:0 14px}
.qty button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#f2f2f2;color:#000;border-radius:99px;padding:10px 18px;font-weight:600;z-index:9;animation:t .25s}
@keyframes t{from{opacity:0;transform:translate(-50%,-8px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="app"></div><div class="foot">@wistful_shop_bot</div>

topup:()=>`${top("Wistful Shop",1)}<div class="ctr"><div class="ic" style="font-size:64px;margin-top:20px">💵</div><div class="big" style="color:#666">${S.bal}<small> ₽</small></div><div class="m">На балансе ${rub(S.bal)}</div></div><div class="chips">${[100,300,500,1000].map(n=>`<button class="chip" onclick="window.amt=${n};$('#am').value=${n}">${rub(n)}</button>`).join("")}</div><input class="in" id="am" type="number" inputmode="numeric" placeholder="Своя сумма, ₽"><h2>Способ оплаты</h2>${[["СБП","Через приложение банка"],["Crypto","USDT и другие монеты"],["CryptoBot","Оплата криптовалютой"]].map(([a,b])=>`<div class="card li" style="margin-bottom:8px" onclick="pay('${a}')"><div><b>${a}</b><div class="m">${b}</div></div><span class="ar">›</span></div>`).join("")}<div class="m ctr" style="margin-top:16px">Оплачивая, вы принимаете пользовательское соглашение и политику конфиденциальности</div>`,
send:()=>`${top("Wistful Shop",1)}<div class="ctr"><div class="ic" style="font-size:64px;margin-top:20px">🪙</div><div class="big" style="color:#666">${S.bal}<small> ₽</small></div><div class="m">Можно передать ${rub(S.bal)}</div></div><div class="chips">${[100,500,1000].map(n=>`<button class="chip" onclick="$('#sa').value=${n}">${rub(n)}</button>`).join("")}<button class="chip" onclick="$('#sa').value=${S.bal}">Всё</button></div><input class="in" id="sa" type="number" inputmode="numeric" placeholder="Сумма, ₽" style="margin-bottom:10px"><input class="in" id="to" placeholder="ID или @username"><div class="m" style="margin:6px 8px">ID есть в профиле шопа</div><div class="bb"><button class="btn" ${S.bal?"":"disabled"} onclick="send()">${S.bal?"Передать":"Нечего передавать"}</button></div>`,
ref:()=>{const l=`t.me/${BOT}?start=ref${U.id}`;return `${top("Рефка",1)}<div class="ctr"><div class="ic" style="font-size:64px;margin-top:30px">🔺</div><div class="big">${REF}<small>%</small></div><div class="m">с пополнений каждого приглашённого друга</div></div><div class="grid" style="margin:20px 0"><div class="card"><div class="m">Приглашено</div><b>${S.friends} друзей</b></div><div class="card"><div class="m">Доход</div><b>${rub(S.inc)}</b></div></div><h2>Ваша ссылка</h2><div class="card li" onclick="navigator.clipboard&&navigator.clipboard.writeText('https://${l}');toast('Ссылка скопирована')">🔗<div><b style="font-size:14px">${l}</b><div class="m">Нажмите, чтобы скопировать</div></div></div><div class="bb"><button class="btn" onclick="share('${l}')">Пригласить друга</button></div>`}};
function draw(){const[r,a]=cur(),a2=$("#app");a2.innerHTML=V[r](a)+(["shop","buys","about","me"].includes(r)?nav(r):"");a2.scrollTop=0;if(tg){const b=tg.BackButton;S.stack.length>1?(b.show(),b.onClick(back)):b.hide()}}
function qty(d,id){const p=P.find(x=>x.id==id);q=Math.max(1,Math.min(p.st||99,q+d));$("#q").textContent=q;$("#buy").textContent=`Купить · ${p.pr*q} ₽`}
function buy(id){const p=P.find(x=>x.id==id),s=p.pr*q;if(S.bal<s){toast("Не хватает "+rub(s-S.bal));go("topup");return}S.bal-=s;S.buys.push({n:p.n,q,s,t:new Date().toLocaleString("ru-RU")});if(p.st)p.st=Math.max(0,p.st-q);q=1;save();toast("Куплено! Данные придут в чат бота");tab("buys")}
function pay(m){const n=+($("#am").value||window.amt||0);if(n<50){toast("Минимум 50 ₽");return}S.bal+=n;save();toast(`Тест: +${n} ₽ через ${m}`);back()}
function send(){const n=+$("#sa").value,t=$("#to").value.trim();if(!t||n<1||n>S.bal){toast("Проверьте сумму и получателя");return}S.bal-=n;save();toast(`Передано ${rub(n)} → ${t}`);back()}
function share(l){const u="https://t.me/share/url?url="+encodeURIComponent("https://"+l);tg?tg.openTelegramLink(u):window.open(u,"_blank")}
window.q=1;draw();
</script></body></html>
